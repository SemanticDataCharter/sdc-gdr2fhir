# SDCHealth Specimen, chained to a Laboratory Report, in its FHIR R4 document Bundle
# Written by tools/build_mapping.py from tools/specs/sdchealth_specimen.py; labels in the comments.
mapping:
  id: sdchealth-specimen-fhir-r4
  version: 1
  author: Axius SDC, Inc.
  date: '2026-11-21'
  description: 'An SDCHealth Specimen record chained to a Laboratory Report by reference (library decision 12): a Specimen
    (SpecimenEu, HL7 Europe Laboratory Report 2.1.0) in the report''s Bundle, listed by its DiagnosticReport. It maps only
    with its report (sdc-gdr2fhir''s map_chain).'
model:
  ct_id: dkzoy1j9aw2u7i7x5lseo7ro
  schema_sha256: e172bf637a49ccdd0ea1b4af13c4a58d6aaa8b556846605fa6eea8636d9412be
target:
  name: HL7 FHIR
  version: R4
reference_model: true
rules:
  # Specimen
  - {cluster: tkeyrlexm503526pztmcl6ov, to: Bundle, attributes: {'@chained-to': rguwjl3y1d2cxmcv7vooocji spec}}
  # Accession Identifier
  - {component: yfgaozed8j7bmza0kipkpa3c, to: /Bundle/=entry#spec/=resource/accessionIdentifier/value, transform: copy, attributes: {resourceType: Specimen, meta/profile: 'http://hl7.eu/fhir/laboratory/StructureDefinition/Specimen-eu-lab', subject/reference: '{entry#patient}'}, also: [{to: /Bundle/=entry#dr/=resource/+specimen/reference, transform: constant, value: '{entry#spec}'}]}
  # Received Date Time
  - {component: alx0kidf4rsfkw629yhxls0n, to: /Bundle/=entry#spec/=resource/receivedTime, transform: copy}
  # Specimen Status
  - {component: r2q2imyqznla35wrd3hvwzz8, to: /Bundle/=entry#spec/=resource/status, transform: binding, prefix: 'http://hl7.org/fhir/specimen-status'}
  # Specimen Type (SNOMED CT)
  - {cluster: z745kp9alza1pw9cljepuati, to: /Bundle/=entry#spec/=resource/type}
  # Code System: SNOMED CT (within Specimen Type (SNOMED CT))
  - {component: q75pzzv36or6dxgjrrbvmun5, within: [z745kp9alza1pw9cljepuati], to: coding/system, transform: copy}
  # Specimen Type Code (SNOMED CT)
  - {component: g2th9ypxvjvctbym1cj61m3x, to: coding/code, transform: copy}
  # Code Display Text (within Specimen Type (SNOMED CT))
  - {component: eo5tlfr0576ypknys5alvcn0, within: [z745kp9alza1pw9cljepuati], to: text, transform: copy}
  # Specimen Condition
  - {component: p6zwenvjwmiph5fh6plbg4r3, to: /Bundle/=entry#spec/=resource/condition/coding/code, transform: binding, prefix: 'http://terminology.hl7.org/CodeSystem/v2-0493', also: [{to: /Bundle/=entry#spec/=resource/condition/coding/system, transform: constant, value: 'http://terminology.hl7.org/CodeSystem/v2-0493'}]}
  # Specimen Combined
  - {component: yo8rehj1kjwj69yftisnngwu, to: '-', transform: omit, reason: 'the guide''s map: R4 Specimen has no such element (Specimen.combined exists only in R5)'}
  # Note
  - {component: zvkk8ztob9gmrvvkzyibyrzk, to: /Bundle/=entry#spec/=resource/+note/text, transform: copy}
  # Specimen Request Reference
  - {component: ywgbfnicyi81lkimoy9n132o, to: /Bundle/=entry#spec/=resource/+request#record/reference, transform: copy}
  # Specimen Parent Specimen Reference
  - {component: qeom247emp459u3jaw4qjfly, to: /Bundle/=entry#spec/=resource/+parent#record/reference, transform: copy}
  # Specimen Source Reference
  - {component: ole7ms3lkwgix1winozlwwkp, to: '-', transform: omit, reason: Specimen.subject is the report's patient (the chain's subject); the IRI of another source record is not a resource of the Bundle}
  # subject
  - {cluster: subject, to: '-', transform: omit, reason: 'the report''s subject: a chained record is about the report''s patient (sdc-gdr2fhir checks that their identifiers agree), whose Patient entry the report writes'}
  # performer (within Specimen Source Participation)
  - {cluster: performer, within: [rguxrbh8f5lrsu6v2kfn8xji], to: '-', transform: omit, reason: 'the report''s subject: a chained record is about the report''s patient (sdc-gdr2fhir checks that their identifiers agree), whose Patient entry the report writes'}
  # Participation Function (Specimen Source)
  - {component: g97xlsu9sx3cjm0bskcoi9ga, to: '-', transform: omit, reason: 'the source is the report''s patient, Specimen.subject (written with the accession identifier)'}
  # start (within Specimen Source Participation)
  - {element: start, within: [rguxrbh8f5lrsu6v2kfn8xji], to: '-', transform: omit, reason: 'Specimen.subject is a reference alone, with no time'}
  # end (within Specimen Source Participation)
  - {element: end, within: [rguxrbh8f5lrsu6v2kfn8xji], to: '-', transform: omit, reason: 'Specimen.subject is a reference alone, with no time'}
  # party-details
  - {cluster: party-details, to: .}
  # Human Name
  - {cluster: g50zuf7amwobbgifx7o52i5l, to: name}
  # Given Name (Person)
  - {component: l9l169co9r23e6fftpvdz4e3, to: given, transform: copy}
  # Surname (Person)
  - {component: jc1lfk3ovt6l8frhxvx8b669, to: family, transform: copy}
  # Name Prefix
  - {component: yahxccv0l1z6ykjxayzkdlkq, to: prefix, transform: copy}
  # Name Suffix
  - {component: l509t0zajfl5atns64d5kl97, to: suffix, transform: copy}
  # Name As Written
  - {component: dp1zp58fx23u0yrs3j9ogqxt, to: text, transform: copy}
  # Name Use
  - {component: bfqinvm7qrgi9jjw1i637moh, to: use, transform: binding, prefix: 'http://hl7.org/fhir/name-use'}
  # Address
  - {cluster: omhsrouda4mt73j1t1fzakqz, to: address}
  # Address (Line 1)
  - {component: ncxxt7wgs7soxw7kbmapxvg3, to: +line, transform: copy}
  # Thoroughfare
  - {component: zzvw3p4x9xcxo6q1xqymvrct, to: +line, transform: copy}
  # Premises Identifier
  - {component: gzfu10juglu35llepko2huo9, to: +line, transform: copy}
  # Delivery Service
  - {component: u7rvm7j5oiuydsiwl0dglpl8, to: +line, transform: copy}
  # City Name
  - {component: a69l16mqaotn0py958oxahhz, to: city, transform: copy}
  # Postal Code
  - {component: w6nfslk6scfpenoewq3eqnev, to: postalCode, transform: copy}
  # Address Use
  - {component: b25dj42zxhm19pih328ga8pl, to: use, transform: binding, prefix: 'http://hl7.org/fhir/address-use'}
  # Address Type
  - {component: ml1y0608by1jakreu950oqb7, to: type, transform: binding, prefix: 'http://hl7.org/fhir/address-type'}
  # Country
  - {cluster: u0rvm9o99w3ked99wbsjyqcj, to: .}
  # Country Code ISO 3166
  - {component: f2jicaigehz7xmwcp1gm5gh0, to: country, transform: copy}
  # Country Name
  - {component: gll1lakps0m1mgas18flfjwq, to: '-', transform: omit, reason: 'FHIR''s Address.country is one string, which holds the record''s ISO 3166 code; the country''s name has no second place (HL7 Europe Base''s country-code extension is not written here)'}
  # Telecom
  - {cluster: lv6uk4agn7as0er1bely65oi, to: telecom}
  # Phone Number
  - {component: zpfwg52r88j6jdypj7rg71ke, to: value, transform: copy}
  # Email Address
  - {component: q922mqaon3yn5zlwf2bszf28, to: ../+telecom/value, transform: copy, also: [{to: ../+telecom/system, transform: constant, value: email}]}
  # Contact Method
  - {component: miqo30r5b554nyj7ubryw43x, to: system, transform: binding, prefix: 'http://hl7.org/fhir/contact-point-system'}
  # Contact Use
  - {component: vmruk4j9y1orvvz8cwafrax5, to: use, transform: binding, prefix: 'http://hl7.org/fhir/contact-point-use'}
  # Person Identifier
  - {cluster: xxvvs7fuoz5lrz44128su7kg, to: identifier}
  # Identifier Value
  - {component: h17egwljmrym3r8ortrqqjwd, to: value, transform: copy}
  # Issuing Authority
  - {component: kphe1er8qxy2dxqdwhpcfk3z, to: assigner/display, transform: copy}
  # Person Identifier Type
  - {component: h2pd0ns7lx2vzey41z6ggt8r, to: type/text, transform: copy, also: [{to: type/coding/system, transform: code, table: {SS: 'http://terminology.hl7.org/CodeSystem/v2-0203', PPN: 'http://terminology.hl7.org/CodeSystem/v2-0203', DL: 'http://terminology.hl7.org/CodeSystem/v2-0203', MR: 'http://terminology.hl7.org/CodeSystem/v2-0203', NI: 'http://terminology.hl7.org/CodeSystem/v2-0203', U: 'http://terminology.hl7.org/CodeSystem/v2-0203'}}, {to: type/coding/code, transform: binding, system: 'http://terminology.hl7.org/CodeSystem/v2-0203'}]}
  # Driver License Number
  - {component: eg635xgsjvipb1rxmaqzt7pv, to: ../+identifier/value, transform: copy, also: [{to: ../+identifier/type/coding/system, transform: constant, value: 'http://terminology.hl7.org/CodeSystem/v2-0203'}, {to: ../+identifier/type/coding/code, transform: link, system: 'http://terminology.hl7.org/CodeSystem/v2-0203'}]}
  # Passport Number
  - {component: g6b7o2z5fdo71vv4t4vv3kfl, to: ../+identifier/value, transform: copy, also: [{to: ../+identifier/type/coding/system, transform: constant, value: 'http://terminology.hl7.org/CodeSystem/v2-0203'}, {to: ../+identifier/type/coding/code, transform: link, system: 'http://terminology.hl7.org/CodeSystem/v2-0203'}]}
  # Social Security Number
  - {component: b77u36g6lormbn7jfls25h5f, to: ../+identifier/value, transform: copy, also: [{to: ../+identifier/type/coding/system, transform: constant, value: 'http://terminology.hl7.org/CodeSystem/v2-0203'}, {to: ../+identifier/type/coding/code, transform: link, system: 'http://terminology.hl7.org/CodeSystem/v2-0203'}]}
  # Country Code ISO 3166 (within Person Identifier)
  - {component: f2jicaigehz7xmwcp1gm5gh0, within: [xxvvs7fuoz5lrz44128su7kg], to: '-', transform: omit, reason: FHIR's Identifier has no element for the country that issued it}
  # Administrative Gender
  - {component: gxzbm758mhdz51xd4bawlfhh, to: gender, transform: binding, prefix: 'http://hl7.org/fhir/administrative-gender'}
  # Date of Birth
  - {component: js564tazefb6udqlh12rj04l, to: birthDate, transform: copy}
  # Deceased Indicator
  - {component: fnr5q1tfq42ez9jia9dqueho, to: deceasedBoolean, transform: copy}
  # Deceased Date
  - {component: vnlhr9c3ykayyegumhb09snf, to: deceasedDateTime, transform: copy}
