# NHANES Participant (FAIR Data Demo) to HL7 FHIR R4 Bundle
# Written by tools/build_mapping.py from tools/specs/nhanes_participant.py; labels in the comments.
mapping:
  id: nhanes-participant-fhir-r4
  version: 1
  author: Axius SDC, Inc.
  date: '2026-10-25'
  description: The NHANES Participant model's values in a FHIR R4 Bundle of type collection. LOINC and SNOMED CT codes and
    answer codes are the model's own bindings; resources and places are declared.
model:
  ct_id: fafj69kdii37997sy7dpsz13
  schema_sha256: 76a133df631066eff6f31efed0a3a9309e6d5d8217306cb7c07582eb10236e19
target:
  name: HL7 FHIR
  version: R4
rules:
  # NHANES Participant Governed Record
  - {cluster: frt9cct9bd5gpc4rkf76ub8e, to: Bundle, attributes: {resourceType: Bundle, type: collection}}
  # NHANES Participant
  - {cluster: qwyg9ps31mb50rfvom7tygjz, to: .}
