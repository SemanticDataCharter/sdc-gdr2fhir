# NHANES Medication 4.3.0 (FAIR Data Demo) to HL7 FHIR R4 Bundle
# Written by tools/build_mapping.py from tools/specs/nhanes_medication_430.py; labels in the comments.
mapping:
  id: nhanes-medication-4.3.0-fhir-r4
  version: 1
  author: Axius SDC, Inc.
  date: '2026-10-27'
  description: 'The NHANES Medication 4.3.0 model''s values in a FHIR R4 Bundle of type collection: a Patient, a MedicationStatement
    with its reasons (ICD-10-CM diagnoses, or NHANES prevention codes under NHANES''s own code system), and the survey''s
    counts as QuestionnaireResponse items.'
model:
  ct_id: plc9gto1kzy244g1r2op257f
  schema_sha256: 4924ad890240ccd1c140e715ad66af587cf64bf365efbd33704a99a6e95d877a
target:
  name: HL7 FHIR
  version: R4
rules:
  # NHANES Medication Governed Record
  - {cluster: rzlq0w15v4jci151pg5bdxpi, to: Bundle, attributes: {resourceType: Bundle, type: collection}}
  # NHANES Medication
  - {cluster: pgn54ip279evo9nxul6bsw2d, to: .}
  # Audit Event
  - {cluster: t2tvd3wylxrstdeu5aw6gkw1, to: '-', transform: omit, reason: 'the record''s provenance and audit: FHIR''s Provenance and AuditEvent require a recorded instant with a time zone, and the record''s times carry none'}
  # PROV Activity
  - {cluster: vmikfu0irht9fmq7q02t3oqs, to: '-', transform: omit, reason: 'the record''s provenance and audit: FHIR''s Provenance and AuditEvent require a recorded instant with a time zone, and the record''s times carry none'}
  # PROV Agent
  - {cluster: c179ilk2ns15cd5rzzdfd6f6, to: '-', transform: omit, reason: 'the record''s provenance and audit: FHIR''s Provenance and AuditEvent require a recorded instant with a time zone, and the record''s times carry none'}
  # Respondent Sequence Number (SEQN)
  - {component: uto4zszvpicva38wx77knz5y, to: =entry#patient/=resource/identifier/value, transform: copy, attributes: {resourceType: Patient}, also: [{to: =entry#patient/=resource/identifier/system, transform: constant, value: 'https://wwwn.cdc.gov/Nchs/Nhanes/2017-2018/DEMO_J.htm#SEQN'}]}
  # Taken Prescription Medicine, Past Month (RXDUSE)
  - {component: a1zr74c1vayeeglk54da7gaf, to: =entry#med/=resource/status, transform: code, table: {'Yes': active, 'No': not-taken}, attributes: {resourceType: MedicationStatement, subject/reference: '{Patient}'}}
  # Generic Drug Code (RXDDRGID)
  - {component: wypildaam8rrd87zkkjxl732, to: =entry#med/=resource/medicationCodeableConcept/coding/code, transform: copy, attributes: {resourceType: MedicationStatement, subject/reference: '{Patient}'}, also: [{to: =entry#med/=resource/medicationCodeableConcept/coding/system, transform: constant, value: 'https://wwwn.cdc.gov/Nchs/Nhanes/2017-2018/RXQ_RX_J.htm#RXDDRGID'}]}
  # Generic Drug Name (RXDDRUG)
  - {component: aut5uvzn0y8wb9xj2ox2n4wh, to: =entry#med/=resource/medicationCodeableConcept/text, transform: copy, attributes: {resourceType: MedicationStatement, subject/reference: '{Patient}'}}
  # Medication Reason 1
  - {cluster: rgrfnzoti0vquavt7m32mf8k, to: ., order: 1}
  # Medication Reason 2
  - {cluster: zljaiuq15yi0ow5y1l7luzoy, to: ., order: 2}
  # Medication Reason 3
  - {cluster: mwmrnudjznage2exv6e8v0ws, to: ., order: 3}
  # Diagnosis (ICD-10-CM)
  - {cluster: eijlau8c1zoa8fbw8fmy0ir4, to: =entry#med/=resource/reasonCode}
  # Diagnosis Code (ICD-10-CM)
  - {component: km7yfw4egxchlb92ya8cqurd, to: coding/code, transform: copy, also: [{to: coding/system, transform: constant, value: 'http://hl7.org/fhir/sid/icd-10-cm'}]}
  # Code Display Text
  - {component: eo5tlfr0576ypknys5alvcn0, to: text, transform: copy}
  # Code System: ICD-10-CM
  - {component: jwgx8nvbtsim7ck4uqmpqyl2, to: coding/system, transform: copy}
  # Number of Days Taken Medicine (RXDDAYS)
  - {component: jybwb4302jxgp028dyk2cgmt, to: =entry#qr/=resource/+item/answer/valueQuantity/value, transform: copy, attributes: {resourceType: QuestionnaireResponse, status: completed, subject/reference: '{Patient}'}, also: [{to: =entry#qr/=resource/+item/linkId, transform: constant, value: jybwb4302jxgp028dyk2cgmt}, {to: =entry#qr/=resource/+item/text, transform: constant, value: Number of Days Taken Medicine (RXDDAYS)}], units: {to: '@unit', transform: copy}}
  # Number of Prescription Medicines Taken (RXDCOUNT)
  - {component: v28gzpjsaxkkgjm470icwipg, to: =entry#qr/=resource/+item/answer/valueQuantity/value, transform: copy, attributes: {resourceType: QuestionnaireResponse, status: completed, subject/reference: '{Patient}'}, also: [{to: =entry#qr/=resource/+item/linkId, transform: constant, value: v28gzpjsaxkkgjm470icwipg}, {to: =entry#qr/=resource/+item/text, transform: constant, value: Number of Prescription Medicines Taken (RXDCOUNT)}], units: {to: '@unit', transform: copy}}
  # Prevention Reason (NHANES)
  - {cluster: fyurnfjn767pebwima5aq1ek, to: =entry#med/=resource/reasonCode}
  # Prevention Reason Code (NHANES)
  - {component: fkfgjboicxhcx4j0l7jhqw42, to: coding/code, transform: copy, also: [{to: coding/system, transform: constant, value: 'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/RXQ_RX_J.htm'}]}
  # Code System: NHANES Prevention Reason
  - {component: m5mmhesnjwbf52fwdo8jzqxp, to: coding/system, transform: copy}
